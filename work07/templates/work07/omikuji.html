<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>おみくじ</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'work07/styles.css' %}">
</head>

<body>
    <h1>おみくじ</h1>

    <!-- おみくじを引くボタン -->
    <form method="get">
        <button type="submit" name="draw" value="1">おみくじを引く</button>
    </form>

    <!-- 結果表示 -->
    {% if result %}
    <p>結果：{{ result }}</p>
    {% endif %}

    <br>
    <button onclick="location.href='{% url 'work07_top' %}'">トップに戻る</button>
</body>

</html>
