{% load static %}

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>BMI計算してくれるくん</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <h1>BMI計算してくれるくん</h1>
    <form method="POST">
        {% csrf_token %}
        <label>身長(cm)：<input type="number" name="height" step="0.1" required></label><br>
        <label>体重(kg)：<input type="number" name="weight" step="0.1" required></label><br>
        <button type="submit">計算する</button>
    </form>

    {% if result %}
    <p>あなたのBMIは <strong>{{ result }}</strong> です！</p>
    {% endif %}

    <p><a href="{% url 'work06:index' %}">← トップに戻る</a></p>
</body>

</html>
