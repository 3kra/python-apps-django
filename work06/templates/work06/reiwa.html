<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>令和→西暦変換</title>
</head>

<body>
    <h1>令和 → 西暦変換ツール</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">変換</button>

    {% if result %}
    <p>{{ result }}</p>
    {% endif %}

    <p><a href="{% url 'work06:index' %}">トップに戻る</a></p>
</body>

</html>
